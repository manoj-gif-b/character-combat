<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Combat – Dice Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #020208;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Share Tech Mono', monospace;
    }
    #game-wrap {
      width: 100%;
      max-width: 520px;
      padding: 12px;
    }
    #game-title {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 6px;
      color: rgba(255,255,255,0.25);
      margin-bottom: 10px;
    }
    #game {
      width: 100%;
      height: 660px;
      background: #050510;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
    }
    .scanline {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none; z-index: 100;
    }
    #p2zone {
      height: 248px;
      background: linear-gradient(180deg, #0a0015 0%, #050510 100%);
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 12px 0;
    }
    #p1zone {
      height: 248px;
      background: linear-gradient(0deg, #000a0f 0%, #050510 100%);
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 12px 8px;
    }
    #midbar {
      height: 112px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; gap: 28px;
      position: relative; background: #050510;
    }
    .p-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px; font-weight: 700; letter-spacing: 4px; margin-bottom: 4px;
    }
    .victory-box {
      display: flex; gap: 8px; align-items: center; justify-content: center;
      padding: 4px 16px; border-radius: 6px; min-height: 32px; margin-bottom: 4px;
    }
    #vbox2 { border: 1px solid rgba(255,34,68,0.4); background: rgba(255,34,68,0.05); }
    #vbox1 { border: 1px solid rgba(0,207,255,0.4); background: rgba(0,207,255,0.05); }
    .bullet-slot {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1px dashed rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: all 0.3s; cursor: default; position: relative;
    }
    .bullet-slot.filled-red  { border-color: #ff2244; text-shadow: 0 0 8px #ff2244; cursor: pointer; }
    .bullet-slot.filled-blue { border-color: #00cfff; text-shadow: 0 0 8px #00cfff; cursor: pointer; }
    .bullet-slot.filled-red:hover  { box-shadow: 0 0 12px #ff2244; }
    .bullet-slot.filled-blue:hover { box-shadow: 0 0 12px #00cfff; }
    .bullet-slot.attack-selected { animation: selectedPulse 0.5s ease-in-out infinite alternate !important; }
    @keyframes selectedPulse {
      0%   { box-shadow: 0 0 6px currentColor, 0 0 20px currentColor; transform: scale(1); }
      100% { box-shadow: 0 0 20px currentColor, 0 0 40px currentColor; transform: scale(1.15); }
    }
    .chars-row {
      display: flex; gap: 10px; justify-content: center;
      flex: 1; align-items: flex-end; padding-bottom: 4px; width: 100%;
    }
    .char-card {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-width: 52px; cursor: default; border-radius: 8px; padding: 3px;
      transition: all 0.3s; position: relative; border: 1px solid transparent;
    }
    .char-card.targetable {
      cursor: crosshair;
      border-color: rgba(255,200,0,0.6);
      animation: targetShake 0.3s ease-in-out infinite;
    }
    .char-card.targetable:hover {
      background: rgba(255,200,0,0.08);
      box-shadow: 0 0 14px rgba(255,200,0,0.4);
    }
    @keyframes targetShake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-2px); }
      75%      { transform: translateX(2px); }
    }
    .char-num { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }
    .char-fig {
      width: 46px; height: 82px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: flex-end; gap: 1px; position: relative;
    }
    .char-part {
      font-size: 18px; transition: all 0.4s;
      opacity: 0; transform: scale(0.5); line-height: 1;
    }
    .char-part.show { opacity: 1; transform: scale(1); }
    .stage-bar { display: flex; gap: 3px; margin-top: 3px; }
    .stage-pip {
      width: 8px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.1); transition: all 0.3s;
    }
    .stage-pip.active-red  { background: #ff2244; box-shadow: 0 0 4px #ff2244; }
    .stage-pip.active-blue { background: #00cfff; box-shadow: 0 0 4px #00cfff; }
    #lastroll-wrap { display: flex; flex-direction: column; align-items: center; }
    #lastroll-label { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 3px; margin-bottom: 2px; }
    #lastroll {
      font-family: 'Orbitron', sans-serif; font-size: 48px; font-weight: 900;
      color: #fff; text-shadow: 0 0 30px currentColor;
      transition: color 0.3s, text-shadow 0.3s; min-width: 76px; text-align: center;
    }
    #turn-ind {
      font-size: 9px; letter-spacing: 2px; padding: 4px 12px;
      border-radius: 20px; border: 1px solid; text-align: center; transition: all 0.3s;
    }
    #attack-banner {
      font-size: 10px; letter-spacing: 2px; padding: 4px 14px;
      border-radius: 20px; border: 1px solid rgba(255,200,0,0.6);
      color: #ffc800; background: rgba(255,200,0,0.08);
      text-align: center; display: none;
      animation: bannerPulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes bannerPulse {
      0%   { box-shadow: 0 0 6px rgba(255,200,0,0.3); }
      100% { box-shadow: 0 0 18px rgba(255,200,0,0.7); }
    }
    .dice-btn {
      width: 68px; height: 68px; border-radius: 12px; border: 2px solid;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 30px; position: absolute; bottom: 12px;
      transition: all 0.2s; background: rgba(0,0,0,0.6); user-select: none;
    }
    #dice-p1 { left: 12px; border-color: #00cfff; box-shadow: 0 0 16px rgba(0,207,255,0.3), inset 0 0 16px rgba(0,207,255,0.05); }
    #dice-p2 { right: 12px; border-color: #ff2244; box-shadow: 0 0 16px rgba(255,34,68,0.3), inset 0 0 16px rgba(255,34,68,0.05); }
    .dice-btn:hover:not(:disabled) { transform: scale(1.08); }
    .dice-btn:active:not(:disabled) { transform: scale(0.95); }
    .dice-btn:disabled { opacity: 0.28; cursor: not-allowed; transform: none !important; }
    .dice-btn.shake { animation: shakeDice 0.4s ease; }
    @keyframes shakeDice {
      0%,100% { transform: rotate(0); }
      20% { transform: rotate(-15deg) scale(1.1); }
      40% { transform: rotate(15deg) scale(1.1); }
      60% { transform: rotate(-10deg); }
      80% { transform: rotate(10deg); }
    }
    #particle-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
    #overlay {
      position: absolute; inset: 0; background: rgba(5,5,16,0.92);
      display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200;
    }
    #overlay.show { display: flex; }
    #win-text {
      font-family: 'Orbitron', sans-serif; font-size: 36px; font-weight: 900;
      letter-spacing: 4px; margin-bottom: 8px;
    }
    #win-sub { font-size: 12px; letter-spacing: 3px; margin-bottom: 24px; opacity: 0.6; color: #fff; }
    #restart-btn {
      font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 3px;
      padding: 10px 28px; border-radius: 6px; cursor: pointer;
      border: 2px solid; background: transparent; transition: all 0.2s;
    }
    #restart-btn:hover { transform: scale(1.05); }
    .bullet-fly { position: absolute; font-size: 20px; z-index: 60; pointer-events: none; }
    #divider {
      height: 1px; flex-shrink: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      margin: 0 24px;
    }
    .destroy-flash { animation: destroyFlash 0.6s ease-out forwards; }
    @keyframes destroyFlash {
      0%   { background: rgba(255,50,0,0.5); box-shadow: 0 0 30px rgba(255,50,0,0.8); }
      50%  { background: rgba(255,50,0,0.2); }
      100% { background: transparent; box-shadow: none; }
    }
    #game-hint {
      text-align: center; font-size: 10px; color: rgba(255,255,255,0.18);
      letter-spacing: 2px; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <div id="game-title">CHARACTER COMBAT · DICE EDITION</div>
    <div id="game">
      <div class="scanline"></div>
      <canvas id="particle-canvas"></canvas>

      <!-- Player 2 Zone (top) -->
      <div id="p2zone">
        <div class="p-label" style="color:#ff2244;text-shadow:0 0 10px #ff2244">▲ PLAYER 2 ▲</div>
        <div class="victory-box" id="vbox2">
          <div class="bullet-slot" id="b2-0"></div>
          <div class="bullet-slot" id="b2-1"></div>
          <div class="bullet-slot" id="b2-2"></div>
        </div>
        <div class="chars-row" id="chars2"></div>
      </div>

      <div id="divider"></div>

      <!-- Middle HUD -->
      <div id="midbar">
        <div id="lastroll-wrap">
          <div id="lastroll-label">LAST ROLL</div>
          <div id="lastroll">—</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
          <div id="turn-ind" style="color:#00cfff;border-color:#00cfff;background:rgba(0,207,255,0.1)">P1 TURN</div>
          <div id="attack-banner">⚡ ATTACK MODE — SELECT TARGET</div>
        </div>
      </div>

      <div id="divider"></div>

      <!-- Player 1 Zone (bottom) -->
      <div id="p1zone">
        <div class="chars-row" id="chars1"></div>
        <div class="victory-box" id="vbox1">
          <div class="bullet-slot" id="b1-0"></div>
          <div class="bullet-slot" id="b1-1"></div>
          <div class="bullet-slot" id="b1-2"></div>
        </div>
        <div class="p-label" style="color:#00cfff;text-shadow:0 0 10px #00cfff">▼ PLAYER 1 ▼</div>
      </div>

      <!-- Dice Buttons -->
      <button class="dice-btn" id="dice-p1">🎲</button>
      <button class="dice-btn" id="dice-p2">🎲</button>

      <!-- Win Overlay -->
      <div id="overlay">
        <div id="win-text"></div>
        <div id="win-sub">VICTORY</div>
        <button id="restart-btn">PLAY AGAIN</button>
      </div>
    </div>
    <div id="game-hint">ROLL ODD NUMBERS · BUILD YOUR CHARACTER · EARN 3 BULLETS TO WIN · CLICK BULLET TO ATTACK</div>
  </div>

  <script>
    const ODDS = [1, 3, 5, 7, 9];
    const PARTS = ['🗣','🫀','💪','🔫','💥'];
    const state = {
      turn: 1,
      rolls: { 1:{1:0,3:0,5:0,7:0,9:0}, 2:{1:0,3:0,5:0,7:0,9:0} },
      bullets: { 1:0, 2:0 },
      attackMode: false,
      attackingPlayer: null,
      attackBulletIdx: null,
      gameOver: false
    };

    function buildChars() {
      [1, 2].forEach(p => {
        const container = document.getElementById('chars' + p);
        container.innerHTML = '';
        ODDS.forEach(n => {
          const card = document.createElement('div');
          card.className = 'char-card';
          card.id = `cc${p}-${n}`;
          card.dataset.player = p;
          card.dataset.num = n;
          const numEl = document.createElement('div');
          numEl.className = 'char-num';
          numEl.textContent = n;
          const fig = document.createElement('div');
          fig.className = 'char-fig';
          PARTS.forEach((em, i) => {
            const part = document.createElement('div');
            part.className = 'char-part';
            part.id = `part${p}-${n}-${i}`;
            part.textContent = em;
            if (i === 4) part.style.fontSize = '14px';
            fig.appendChild(part);
          });
          const bar = document.createElement('div');
          bar.className = 'stage-bar';
          bar.id = `bar${p}-${n}`;
          for (let i = 0; i < 5; i++) {
            const pip = document.createElement('div');
            pip.className = 'stage-pip';
            pip.id = `pip${p}-${n}-${i}`;
            bar.appendChild(pip);
          }
          card.appendChild(numEl);
          card.appendChild(fig);
          card.appendChild(bar);
          card.addEventListener('click', () => handleCardClick(parseInt(card.dataset.player), parseInt(card.dataset.num)));
          container.appendChild(card);
        });
      });
    }

    function handleCardClick(targetPlayer, num) {
      if (!state.attackMode) return;
      if (targetPlayer === state.attackingPlayer) return;
      if (state.rolls[targetPlayer][num] === 0) return;
      executeDestroy(state.attackingPlayer, targetPlayer, num);
    }

    function activateAttackMode(player, bulletIdx) {
      if (state.attackMode) { cancelAttackMode(); return; }
      const opponent = player === 1 ? 2 : 1;
      let hasTarget = false;
      ODDS.forEach(n => { if (state.rolls[opponent][n] > 0) hasTarget = true; });
      if (!hasTarget) return;
      state.attackMode = true;
      state.attackingPlayer = player;
      state.attackBulletIdx = bulletIdx;
      const slot = document.getElementById(`b${player}-${bulletIdx}`);
      slot.style.color = player === 1 ? '#00cfff' : '#ff2244';
      slot.classList.add('attack-selected');
      document.getElementById('attack-banner').style.display = 'block';
      document.getElementById(`dice-p${player}`).disabled = true;
      ODDS.forEach(n => {
        const card = document.getElementById(`cc${opponent}-${n}`);
        if (state.rolls[opponent][n] > 0) card.classList.add('targetable');
      });
    }

    function cancelAttackMode() {
      if (!state.attackMode) return;
      const player = state.attackingPlayer;
      const opponent = player === 1 ? 2 : 1;
      const slot = document.getElementById(`b${player}-${state.attackBulletIdx}`);
      if (slot) slot.classList.remove('attack-selected');
      document.getElementById('attack-banner').style.display = 'none';
      ODDS.forEach(n => document.getElementById(`cc${opponent}-${n}`).classList.remove('targetable'));
      state.attackMode = false;
      state.attackingPlayer = null;
      state.attackBulletIdx = null;
      updateTurnUI();
    }

    function executeDestroy(attacker, victim, num) {
      const bulletIdx = state.attackBulletIdx;
      const opponent = attacker === 1 ? 2 : 1;
      ODDS.forEach(n => document.getElementById(`cc${opponent}-${n}`).classList.remove('targetable'));
      document.getElementById('attack-banner').style.display = 'none';
      const attackerSlot = document.getElementById(`b${attacker}-${bulletIdx}`);
      attackerSlot.classList.remove('attack-selected');
      attackerSlot.className = 'bullet-slot';
      attackerSlot.textContent = '';
      attackerSlot.style.color = '';
      state.bullets[attacker]--;
      rebuildBulletDisplay(attacker);
      spawnDestroyEffect(victim, num);
      setTimeout(() => {
        resetSlot(victim, num);
        state.attackMode = false;
        state.attackingPlayer = null;
        state.attackBulletIdx = null;
        state.turn = attacker === 1 ? 2 : 1;
        updateTurnUI();
      }, 700);
    }

    function rebuildBulletDisplay(player) {
      const count = state.bullets[player];
      const color = player === 1 ? 'filled-blue' : 'filled-red';
      for (let i = 0; i < 3; i++) {
        const slot = document.getElementById(`b${player}-${i}`);
        slot.className = 'bullet-slot';
        slot.textContent = '';
        slot.onclick = null;
        slot.style.cursor = 'default';
        if (i < count) {
          slot.className = `bullet-slot ${color}`;
          slot.textContent = '💥';
          const idx = i;
          slot.onclick = () => { if (state.turn === player && !state.gameOver) activateAttackMode(player, idx); };
        }
      }
    }

    function resetSlot(player, num) {
      state.rolls[player][num] = 0;
      for (let i = 0; i < 5; i++) {
        const part = document.getElementById(`part${player}-${num}-${i}`);
        if (part) part.classList.remove('show');
        const pip = document.getElementById(`pip${player}-${num}-${i}`);
        if (pip) pip.className = 'stage-pip';
      }
    }

    function spawnDestroyEffect(player, num) {
      const card = document.getElementById(`cc${player}-${num}`);
      card.classList.add('destroy-flash');
      const game = document.getElementById('game');
      const r = card.getBoundingClientRect();
      const gr = game.getBoundingClientRect();
      const cx = r.left - gr.left + r.width / 2;
      const cy = r.top - gr.top + r.height / 2;
      const colors = ['#ff6600','#ffaa00','#ff2244','#ffffff'];
      for (let i = 0; i < 32; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 5;
        particles.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, life:1, decay:0.025+Math.random()*0.03, size:3+Math.random()*5, color:colors[Math.floor(Math.random()*colors.length)] });
      }
      setTimeout(() => card.classList.remove('destroy-flash'), 700);
    }

    function updateTurnUI() {
      const ind = document.getElementById('turn-ind');
      const d1 = document.getElementById('dice-p1');
      const d2 = document.getElementById('dice-p2');
      if (state.turn === 1) {
        ind.style.color = '#00cfff'; ind.style.borderColor = '#00cfff'; ind.style.background = 'rgba(0,207,255,0.1)';
        ind.textContent = 'P1 TURN';
        d1.disabled = false; d2.disabled = true;
      } else {
        ind.style.color = '#ff2244'; ind.style.borderColor = '#ff2244'; ind.style.background = 'rgba(255,34,68,0.1)';
        ind.textContent = 'P2 TURN';
        d1.disabled = true; d2.disabled = false;
      }
      [1, 2].forEach(p => {
        for (let i = 0; i < 3; i++) {
          const slot = document.getElementById(`b${p}-${i}`);
          if (slot && (slot.classList.contains('filled-red') || slot.classList.contains('filled-blue'))) {
            const idx = i;
            slot.onclick = (p === state.turn && !state.gameOver) ? () => activateAttackMode(p, idx) : null;
            slot.style.cursor = (p === state.turn && !state.gameOver) ? 'pointer' : 'default';
          }
        }
      });
    }

    function rollDice(player) {
      if (state.gameOver || state.attackMode) return;
      const n = ODDS[Math.floor(Math.random() * 5)];
      const color = player === 1 ? '#00cfff' : '#ff2244';
      const lr = document.getElementById('lastroll');
      lr.textContent = n; lr.style.color = color; lr.style.textShadow = `0 0 30px ${color}`;
      const btn = document.getElementById('dice-p' + player);
      btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
      setTimeout(() => btn.classList.remove('shake'), 500);
      spawnParticles(btn, color);
      processRoll(player, n);
    }

    function processRoll(player, n) {
      if (state.rolls[player][n] >= 5) return finishTurn(player);
      state.rolls[player][n]++;
      const stage = state.rolls[player][n];
      const colorClass = player === 1 ? 'active-blue' : 'active-red';
      const pip = document.getElementById(`pip${player}-${n}-${stage-1}`);
      if (pip) pip.className = `stage-pip ${colorClass}`;
      const part = document.getElementById(`part${player}-${n}-${stage-1}`);
      if (part) setTimeout(() => part.classList.add('show'), 100);
      if (stage === 5) { setTimeout(() => fireBullet(player, n), 400); }
      else { finishTurn(player); }
    }

    function finishTurn(player) {
      state.turn = player === 1 ? 2 : 1;
      updateTurnUI();
    }

    function fireBullet(player, n) {
      const card = document.getElementById(`cc${player}-${n}`);
      const game = document.getElementById('game');
      const cR = card.getBoundingClientRect();
      const gR = game.getBoundingClientRect();
      const vbox = document.getElementById('vbox' + player);
      const vR = vbox.getBoundingClientRect();
      const fly = document.createElement('div');
      fly.className = 'bullet-fly';
      fly.textContent = player === 1 ? '🔵' : '🔴';
      fly.style.left = (cR.left - gR.left + cR.width/2 - 12) + 'px';
      fly.style.top  = (cR.top  - gR.top) + 'px';
      fly.style.position = 'absolute'; fly.style.zIndex = '60';
      fly.style.transition = 'left 0.6s cubic-bezier(0.2,0,0.8,1), top 0.6s cubic-bezier(0.2,0,0.8,1), transform 0.6s';
      game.appendChild(fly);
      void fly.offsetWidth;
      fly.style.left = (vR.left - gR.left + vR.width/2 - 12) + 'px';
      fly.style.top  = (vR.top  - gR.top) + 'px';
      fly.style.transform = 'scale(1.4)';
      setTimeout(() => { fly.remove(); addBullet(player); }, 660);
    }

    function addBullet(player) {
      const idx = state.bullets[player];
      if (idx >= 3) return finishTurn(player);
      const slot = document.getElementById(`b${player}-${idx}`);
      const colorClass = player === 1 ? 'filled-blue' : 'filled-red';
      slot.className = `bullet-slot ${colorClass}`;
      slot.textContent = '💥';
      state.bullets[player]++;
      spawnVictoryParticles(player);
      if (state.bullets[player] >= 3) { setTimeout(() => showWin(player), 500); return; }
      rebuildBulletDisplay(player);
      finishTurn(player);
    }

    function showWin(player) {
      state.gameOver = true;
      const ov = document.getElementById('overlay');
      const wt = document.getElementById('win-text');
      const rb = document.getElementById('restart-btn');
      const color = player === 1 ? '#00cfff' : '#ff2244';
      wt.textContent = `PLAYER ${player}`;
      wt.style.color = color; wt.style.textShadow = `0 0 30px ${color}, 0 0 60px ${color}`;
      rb.style.color = color; rb.style.borderColor = color;
      ov.classList.add('show');
      for (let i = 0; i < 10; i++) setTimeout(() => spawnVictoryParticles(player), i * 180);
    }

    function restart() {
      state.turn = 1;
      state.rolls = { 1:{1:0,3:0,5:0,7:0,9:0}, 2:{1:0,3:0,5:0,7:0,9:0} };
      state.bullets = { 1:0, 2:0 };
      state.attackMode = false; state.attackingPlayer = null; state.attackBulletIdx = null; state.gameOver = false;
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('lastroll').textContent = '—';
      document.getElementById('lastroll').style.color = '#fff';
      document.getElementById('lastroll').style.textShadow = '0 0 30px #fff';
      document.getElementById('attack-banner').style.display = 'none';
      for (let p = 1; p <= 2; p++) for (let i = 0; i < 3; i++) {
        const s = document.getElementById(`b${p}-${i}`);
        s.className = 'bullet-slot'; s.textContent = ''; s.onclick = null; s.style.cursor = 'default';
      }
      buildChars(); updateTurnUI();
    }

    /* ── Particle Engine ── */
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { const g = document.getElementById('game'); pCanvas.width = g.offsetWidth; pCanvas.height = g.offsetHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function spawnParticles(btn, color) {
      const g = document.getElementById('game');
      const r = btn.getBoundingClientRect(), gr = g.getBoundingClientRect();
      const cx = r.left - gr.left + r.width/2, cy = r.top - gr.top + r.height/2;
      for (let i = 0; i < 24; i++) {
        const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4;
        particles.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, decay:0.03+Math.random()*0.03, size:3+Math.random()*4, color });
      }
    }
    function spawnVictoryParticles(player) {
      const color = player === 1 ? '#00cfff' : '#ff2244';
      const cx = pCanvas.width/2, cy = pCanvas.height/2;
      for (let i = 0; i < 40; i++) {
        const a = Math.random()*Math.PI*2, sp = 3+Math.random()*6;
        particles.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, decay:0.015+Math.random()*0.02, size:4+Math.random()*6, color });
      }
    }
    function animateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= p.decay;
        pCtx.globalAlpha = p.life;
        pCtx.fillStyle = p.color;
        pCtx.shadowBlur = 8; pCtx.shadowColor = p.color;
        pCtx.beginPath(); pCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); pCtx.fill();
        pCtx.shadowBlur = 0;
      });
      pCtx.globalAlpha = 1;
      requestAnimationFrame(animateParticles);
    }

    /* ── Event Listeners ── */
    document.getElementById('dice-p1').addEventListener('click', () => { if (!state.attackMode) rollDice(1); });
    document.getElementById('dice-p2').addEventListener('click', () => { if (!state.attackMode) rollDice(2); });
    document.getElementById('restart-btn').addEventListener('click', restart);
    document.getElementById('game').addEventListener('click', e => {
      if (state.attackMode && !e.target.closest('.char-card') && !e.target.closest('.bullet-slot')) cancelAttackMode();
    });

    buildChars(); updateTurnUI(); animateParticles();
  </script>
</body>
</html>
